services:
  app:
    build: .
    container_name: niflheim-studio
    restart: unless-stopped
    ports:
      - "4800:4800"
    env_file: .env
    environment:
      # The Comfy API proxy runs on the host (scripts/comfy-proxy.sh); reach it from the container.
      COMFY_BASE_URL: http://host.docker.internal:8189
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
