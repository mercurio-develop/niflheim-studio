services:
  app:
    build: .
    container_name: niflheim-studio
    restart: unless-stopped
    ports:
      - "4800:4800"
    # Comfy comes from .env: COMFY_API_KEY with COMFY_BASE_URL empty for Comfy Cloud, or
    # COMFY_BASE_URL=http://host.docker.internal:8189 for the Comfy API proxy on the host.
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
